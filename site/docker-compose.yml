# Dokploy (Docker Compose type). Port 3011 is published on the server so the site opens at
# http://<server-ip>:3011 (for example http://192.168.1.12:3011) with no domain needed.
# To use a domain instead, replace `ports:` with `expose: ["3011"]` and add the domain in
# the Domains tab (Service Name = web, Port = 3011).
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3011:3011"
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3011/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  dokploy-network:
    external: true
