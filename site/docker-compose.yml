# Dokploy (Docker Compose type). Traefik routing is attached by Dokploy from the
# Domains tab (service: web, port: 3011), so no host ports are published here.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3011"
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3011/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  dokploy-network:
    external: true
